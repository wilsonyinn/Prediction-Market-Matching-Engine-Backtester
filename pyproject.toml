[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "predmarket-engine"
version = "0.1.0"
description = "Prediction-market limit order book matching engine and backtester"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tree = ["sortedcontainers>=2.4"]
bench = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "sortedcontainers>=2.4",
  "sortedcontainers-stubs>=2.4",
  "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM",
  "RET", "ARG", "PTH", "PL", "RUF", "ANN", "D", "TID", "TC",
]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# The validation checklist and the match loop legitimately branch a lot. Raising the
# limits is preferable to scattering noqa comments over the core algorithm.
max-branches = 15
max-returns = 12
# bench/harness.py's measured loop dispatches on command type inline (deliberately
# -- see its docstring on why field access happens outside the timed window), which
# reads as more statements than splitting it into helpers would, even though a
# helper call per command would cost real nanoseconds inside the timed region.
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# TC (type-checking-block imports) exists to avoid runtime import cost and circular
# imports in shipped library code; test files are never imported by a consumer, and
# forcing every fixture-typed parameter's import behind `if TYPE_CHECKING:` there is
# boilerplate without a payoff.
"tests/**" = ["D", "ANN", "PLR2004", "ARG", "S101", "TC"]
# Book implementations satisfy engine/book.py's OrderBook protocol, which is the
# single documented source of truth for every method's semantics; repeating the
# same docstring on each implementation would drift rather than inform.
"src/engine/naive_book.py" = ["D102", "D105", "D107"]
"src/engine/array_book.py" = ["D102", "D105", "D107"]
"src/engine/array_book_baseline.py" = ["D102", "D105", "D107"]
"src/engine/tree_book.py" = ["D102", "D105", "D107"]
# Workload generators and the CLI take many keyword-only configuration parameters by
# design; collapsing them into a config object would move the same fields elsewhere
# and make call sites less readable.
"bench/workloads.py" = ["PLR0913"]
"bench/run_bench.py" = ["PLR0913"]

[tool.mypy]
# Not 3.11 (our declared minimum, enforced by CI's 3.11/3.12/3.13 test matrix at
# runtime): numpy's stubs (a transitive dependency of the bench/matplotlib extra,
# pulled in via hypothesis's optional numpy integration) use Python-3.12-only `type`
# statement syntax, which mypy's parser refuses under a lower configured version --
# even with follow_imports=skip on the offending modules, since skip mode still
# parses the target file. python_version only governs mypy's assumed stdlib/typing
# surface, not what our own code can run on; we never use 3.12-only syntax
# ourselves (every module starts with `from __future__ import annotations`), so
# this does not weaken the 3.11 compatibility CI actually checks.
python_version = "3.12"
strict = true
files = ["src", "tests", "bench"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = ["slow: long property/differential runs"]

[tool.coverage.run]
source = ["src/engine"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "^\\s*\\.\\.\\.$",
]
